services:
  mobiapigetway:
    image: ${DOCKER_REGISTRY-}mobileapigetway
    build:
      context: ..
      dockerfile: BackEnd/MobileApiGetway/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:80
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
    - "6000:80"
    networks:
      - some-net

